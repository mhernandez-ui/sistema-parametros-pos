<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Parámetros POS - Credicard</title>
    
    <!-- Tesseract.js (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- PDF.js (Lector PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: #f4f7f6; }
        .visor { flex: 1; border-right: 2px solid #ccc; display: flex; flex-direction: column; background: #e9ecef; position: relative;}
        .drop-zone { flex: 1; display: flex; align-items: center; justify-content: center; border: 3px dashed #6c757d; margin: 20px; border-radius: 10px; color: #6c757d; font-size: 1.2rem; cursor: pointer; transition: 0.3s; text-align: center; padding: 20px;}
        .drop-zone.dragover { background: #dee2e6; border-color: #495057; }
        #preview { width: 100%; height: 100%; display: none; border: none; }
        #ocr-loading { display: none; position: absolute; top: 10px; right: 10px; background: #ffc107; color: #000; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.9rem; z-index: 10;}
        
        .formulario { flex: 1; padding: 20px 30px; overflow-y: auto; display: flex; flex-direction: column; background: #ffffff; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 0.95rem; font-family: inherit;}
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        button { background-color: #0d6efd; color: white; padding: 12px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #0b5ed7; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        #resultado-crm { margin-top: 15px; background: #212529; color: #00ff00; padding: 15px; border-radius: 5px; display: none; font-family: monospace; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.4;}
    </style>
</head>
<body>

    <div class="visor">
        <div id="ocr-loading">Analizando documento... 🔍</div>
        <div class="drop-zone" id="drop-zone">
            Arrastra aquí el PDF o Imagen de la solicitud<br>
            <span style="font-size: 0.9rem; font-weight: normal; margin-top: 10px; display: block;">Lectura OCR automática y adaptativa.</span>
        </div>
        <iframe id="preview"></iframe>
    </div>

    <div class="formulario">
        <h2 style="margin-top: 0; font-size: 1.4rem;">Instalaciones - Credicard</h2>
        <form id="param-form">
            <div class="form-group">
                <label>Nombre del Comercio</label>
                <input type="text" id="comercio" placeholder="Ej: Inversiones C.A." required>
            </div>
            
            <div class="form-group">
                <label>Dirección Fiscal</label>
                <textarea id="direccion" rows="2" placeholder="Extraída del RIF..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>RIF</label>
                    <input type="text" id="rif" placeholder="Ej: J-12345678-9" required>
                </div>
                <div class="form-group">
                    <label>Nº Afiliado</label>
                    <input type="text" id="afiliado" placeholder="Ej: 73497418" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Banco</label>
                    <select id="banco" required>
                        <option value="">Seleccione...</option>
                        <option value="BANCARIBE">Bancaribe</option>
                        <option value="DEL SUR">Del Sur</option>
                        <option value="CARONI">Caroní</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Modelo POS</label>
                    <select id="modelo" required>
                        <option value="">Seleccione...</option>
                        <option value="N910">N910</option>
                        <option value="SP600">SP600</option>
                        <option value="ME51">ME51</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Comunicación</label>
                    <select id="comunicacion" required>
                        <option value="GPRS">GPRS</option>
                        <option value="WIFI">WIFI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Operadora</label>
                    <select id="operadora" required>
                        <option value="DIGITEL">Digitel</option>
                        <option value="MOVISTAR">Movistar</option>
                        <option value="MOVILNET">Movilnet</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btn-procesar">Cargar a Sheets y Generar CRM</button>
        </form>
        <div id="resultado-crm"></div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymMNnozPdKghH76kkT976jShfFP_7DZh-28FJkGfrguUdP7edlPNYpeOqCTEKXlSar/exec";
        
        const dropZone = document.getElementById('drop-zone');
        const preview = document.getElementById('preview');
        const form = document.getElementById('param-form');
        const resultadoCrm = document.getElementById('resultado-crm');
        const btnProcesar = document.getElementById('btn-procesar');
        const ocrLoading = document.getElementById('ocr-loading');
        let archivoSeleccionado = null;

        // --- Drag & Drop ---
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                archivoSeleccionado = e.dataTransfer.files[0];
                const urlTemporal = URL.createObjectURL(archivoSeleccionado);
                dropZone.style.display = 'none';
                preview.style.display = 'block';
                preview.src = urlTemporal;

                // Limpiar formulario antes de una nueva lectura
                document.getElementById('comercio').value = "";
                document.getElementById('direccion').value = "";
                document.getElementById('rif').value = "";
                document.getElementById('afiliado').value = "";

                if (archivoSeleccionado.type.startsWith('image/')) {
                    ejecutarOCR(archivoSeleccionado);
                } else if (archivoSeleccionado.type === 'application/pdf') {
                    procesarPDF(archivoSeleccionado);
                }
            }
        });

        // --- Conversión PDF ---
        async function procesarPDF(file) {
            ocrLoading.style.display = 'block';
            ocrLoading.innerText = "Convirtiendo PDF... 📄";
            btnProcesar.disabled = true;

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    const page = await pdf.getPage(1);
                    const scale = 2.5; // Alta resolución para mejorar el OCR
                    const viewport = page.getViewport({scale: scale});
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    const imageBase64 = canvas.toDataURL('image/png');
                    
                    ejecutarOCR(imageBase64);
                } catch (error) {
                    ocrLoading.style.display = 'none';
                    btnProcesar.disabled = false;
                }
            };
            fileReader.readAsArrayBuffer(file);
        }

        // --- Motor Central de OCR y Máquina de Estados ---
        async function ejecutarOCR(imagenOSource) {
            ocrLoading.style.display = 'block';
            ocrLoading.innerText = "IA leyendo imagen... 🔍";
            btnProcesar.disabled = true;

            try {
                const result = await Tesseract.recognize(imagenOSource, 'spa');
                
                const lineas = result.data.text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const regexRifExact = /[JGVE]-?\d{8,9}/i;
                
                let estadoLectura = "BUSCANDO_RIF";
                let direccionFiscal = "";

                for (let i = 0; i < lineas.length; i++) {
                    // Cortafuegos ampliado: ignorar lado derecho del documento (incluyendo palabras de sedes regionales)
                    let linea = lineas[i].split(/(FECHA|ÚLTIMA|ULTIMA|N° COMP|N\* COMP|N°COMP|GERENCIA|DATOS DE REGISTRO|IDENTIFICACIÓN DEL CONTRIBUYENTE|TRIBUTOS|SEDE REGIONAL|INTERNOS)/i)[0].trim();
                    if (!linea) continue;

                    const lineaUpper = linea.toUpperCase();

                    // --- ESTADO 1: Extraer RIF ---
                    if (estadoLectura === "BUSCANDO_RIF") {
                        const matchRif = linea.match(regexRifExact);
                        if (matchRif) {
                            let rifLimpio = matchRif[0].toUpperCase().replace(/[^A-Z0-9]/g, '');
                            if (rifLimpio.length === 10) {
                                document.getElementById('rif').value = `${rifLimpio.charAt(0)}-${rifLimpio.substring(1,9)}-${rifLimpio.charAt(9)}`;
                            } else {
                                document.getElementById('rif').value = rifLimpio; 
                            }
                            
                            let restoDeLinea = linea.replace(/RIF[\s:]*/ig, '').replace(matchRif[0], '').trim();
                            if (restoDeLinea.length > 3) {
                                document.getElementById('comercio').value = restoDeLinea;
                                estadoLectura = "BUSCANDO_DOMICILIO";
                            } else {
                                estadoLectura = "BUSCANDO_NOMBRE";
                            }
                            continue;
                        }
                    }

                    // --- ESTADO 2: Extraer Nombre del Comercio (Formato Nuevo) ---
                    if (estadoLectura === "BUSCANDO_NOMBRE") {
                        if (!lineaUpper.includes('DOMICILIO') && !lineaUpper.includes('DIRECCIÓN')) {
                            if (linea.length > 3) {
                                document.getElementById('comercio').value = linea;
                                estadoLectura = "BUSCANDO_DOMICILIO";
                                continue;
                            }
                        } else {
                            estadoLectura = "BUSCANDO_DOMICILIO"; 
                        }
                    }
                    
                    // --- ESTADO 3: Detectar inicio de Dirección ---
                    if (estadoLectura === "BUSCANDO_DOMICILIO" || lineaUpper.includes('DOMICILIO FISCAL') || lineaUpper.includes('DIRECCIÓN FISCAL') || lineaUpper.includes('DIRECCION FISCAL')) {
                        if (lineaUpper.includes('DOMICILIO FISCAL') || lineaUpper.includes('DIRECCIÓN FISCAL') || lineaUpper.includes('DIRECCION FISCAL')) {
                            estadoLectura = "CAPTURANDO_DIRECCION";
                            let fragmento = linea.replace(/(DOMICILIO FISCAL|DIRECCIÓN FISCAL|DIRECCION FISCAL)[\s:]*/ig, '').trim();
                            
                            if (fragmento) { 
                                // Corte exacto en Zona Postal
                                let matchZona = fragmento.match(/(ZONA POSTAL\s*\d+)/i);
                                if (matchZona) { 
                                    direccionFiscal += fragmento.substring(0, matchZona.index + matchZona[0].length) + " ";
                                    estadoLectura = "BUSCANDO_AFILIADO"; 
                                } else {
                                    direccionFiscal += fragmento + " "; 
                                }
                            }
                            continue; 
                        }
                    }

                    // --- ESTADO 4: Recolectar Líneas de la Dirección ---
                    if (estadoLectura === "CAPTURANDO_DIRECCION") {
                        if (lineaUpper.includes('ESTE CONTRIBUYENTE') || lineaUpper.includes('FIRMAS PERSONALES')) {
                            estadoLectura = "BUSCANDO_AFILIADO";
                        } else {
                            // Corte exacto en Zona Postal para evitar leer la columna derecha
                            let matchZona = linea.match(/(ZONA POSTAL\s*\d+)/i);
                            if (matchZona) { 
                                direccionFiscal += linea.substring(0, matchZona.index + matchZona[0].length) + " ";
                                estadoLectura = "BUSCANDO_AFILIADO"; 
                            } else {
                                direccionFiscal += linea + " ";
                            }
                        }
                        continue;
                    }

                    // --- SIEMPRE ACTIVO: Extraer Afiliado ---
                    const regexAfiliado = /afiliado[\s:]*(\d{7,10})/i;
                    const matchAfiliado = linea.match(regexAfiliado);
                    if (matchAfiliado) {
                        document.getElementById('afiliado').value = matchAfiliado[1];
                    }
                }

                if (direccionFiscal) {
                    document.getElementById('direccion').value = direccionFiscal.replace(/\s+/g, ' ').trim();
                }

            } catch (error) {
                console.error("Error en Tesseract:", error);
            } finally {
                ocrLoading.style.display = 'none';
                btnProcesar.disabled = false;
            }
        }

        // --- Enviar Formulario ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnProcesar.innerText = "Registrando...";
            btnProcesar.disabled = true;

            const datosParaGuardar = {
                comercio: document.getElementById('comercio').value,
                direccion: document.getElementById('direccion').value,
                rif: document.getElementById('rif').value,
                afiliado: document.getElementById('afiliado').value,
                banco: document.getElementById('banco').value,
                modelo: document.getElementById('modelo').value,
                comunicacion: document.getElementById('comunicacion').value,
                operadora: document.getElementById('operadora').value
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(datosParaGuardar)
                });
                
                const resultado = await response.json();
                
                if(resultado.status === "éxito") {
                    const textoCrm = `--- DATOS PARA CRM ---\nComercio: ${datosParaGuardar.comercio}\nRIF: ${datosParaGuardar.rif}\nDirección: ${datosParaGuardar.direccion}\nAfiliado: ${datosParaGuardar.afiliado}\nBanco: ${datosParaGuardar.banco}\nModelo POS: ${datosParaGuardar.modelo}\nComunicación: ${datosParaGuardar.comunicacion} / ${datosParaGuardar.operadora}\n----------------------`;
                    resultadoCrm.style.display = 'block';
                    resultadoCrm.innerText = textoCrm + "\n\n(Copia este texto para tu sistema)";
                    
                    form.reset();
                    preview.style.display = 'none';
                    dropZone.style.display = 'flex';
                    archivoSeleccionado = null;
                } else {
                    alert("Error en el script: " + resultado.mensaje);
                }
            } catch (error) {
                alert("Fallo de conexión. Verifica que tengas internet y la URL sea correcta.");
            } finally {
                btnProcesar.innerText = "Cargar a Sheets y Generar CRM";
                btnProcesar.disabled = false;
            }
        });
    </script>
</body>
</html>
